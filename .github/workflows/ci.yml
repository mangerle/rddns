name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 依赖版本完全锁定，避免 CI 与本地因 semver 兼容升级产生差异
  CARGO_NET_OFFLINE: "false"

jobs:
  quality-gate:
    name: 代码质量门禁 (fmt / clippy / test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链 (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo 依赖与构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 校验代码格式 (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: 静态检查 (clippy，警告视为错误)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: 运行测试 (单元 + 集成)
        run: cargo test --locked --all-targets

  build-check:
    name: 多目标构建检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 添加 arm 架构编译目标
        run: rustup target add aarch64-unknown-linux-musl

      - name: 构建 x86_64 musl 静态版本
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: 构建 arm64 musl 静态版本
        run: cargo build --locked --release --target aarch64-unknown-linux-musl
