name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: 创建 GitHub 发布版本 (Create Release)
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整代码历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 基于 Commit 生成分类 Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_CHANGELOG.md

      - name: 创建 Release 草稿并发布 Changelog
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: RELEASE_CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  build-frontend:
    name: 构建前端静态资源 (Build Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖并构建
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  upload-assets:
    name: Build (${{ matrix.target }})
    needs: [create-release, build-frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 64位 (Intel / AMD x86_64)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # Windows 64位 ARM (骁龙 X Elite / Copilot+ PC, Surface ARM, M系列虚拟机)
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          # Windows 32位 (遗留工控机与 32 位 Windows 系统)
          - target: i686-pc-windows-msvc
            os: windows-latest
          # Linux x86_64 纯静态 musl (兼容所有 Linux 发行版与 OpenWrt)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Linux ARM64 纯静态 musl (树莓派 4/5, ARM 软路由/NAS, 云服务器)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # Linux ARMv7 (老款树莓派, 32位 ARM 软路由)
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
          # Linux ARMv6 (第一代树莓派 1/1B+, Raspberry Pi Zero)
          - target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
          # Linux ARMv5TE 纯静态 musl (早期 Marvell 芯片老 NAS、工业网关)
          - target: armv5te-unknown-linux-musleabi
            os: ubuntu-latest
          # Linux 32位 x86 纯静态 musl (老旧 32位工控机、32位 Alpine 容器)
          - target: i686-unknown-linux-musl
            os: ubuntu-latest
          # Linux RISC-V 64位 (全志 D1, Milk-V 等 RISC-V 开发板与网关)
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
          # Linux 龙芯 64位 (国产 LoongArch 3A5000/3C5000 等信创平台)
          - target: loongarch64-unknown-linux-gnu
            os: ubuntu-latest
          # FreeBSD x86_64 (pfSense, OPNsense 等专业防火墙系统)
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
          # FreeBSD ARM64 (树莓派 4/5 或 ARM64 云主机运行的 FreeBSD/OPNsense)
          - target: aarch64-unknown-freebsd
            os: ubuntu-latest
          # FreeBSD 32位 (老旧 32位工控机防火墙)
          - target: i686-unknown-freebsd
            os: ubuntu-latest
          # macOS Intel 架构 (在 macos-latest 上直接交叉编译)
          - target: x86_64-apple-darwin
            os: macos-latest
          # macOS Apple Silicon (M1/M2/M3/M4) 架构
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 配置交叉编译工具链 (自动配置龙芯与特殊交叉目标)
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: 构建并发布二进制产物
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: rddns
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-manifest:
    name: 生成并发布更新清单 (Generate & Publish Manifest)
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 签名依赖 (Install Signing Dependencies)
        run: pip install cryptography

      - name: 生成并上传 latest.json 清单
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          python3 - << 'EOF'
          import os, json, re, urllib.request, base64
          from cryptography.hazmat.primitives.asymmetric import ed25519

          tag = os.environ["TAG_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          priv_key_b64 = os.environ.get("RELEASE_SIGNING_PRIVATE_KEY", "").strip()

          if not priv_key_b64:
              raise ValueError("未检测到 RELEASE_SIGNING_PRIVATE_KEY 签名私钥，请在 GitHub 仓库 Secrets 中配置！")

          priv_key_bytes = base64.b64decode(priv_key_b64)
          if len(priv_key_bytes) != 32:
              raise ValueError(f"RELEASE_SIGNING_PRIVATE_KEY 必须为 32 字节 Ed25519 原始种子，当前解码长度: {len(priv_key_bytes)}")

          signer = ed25519.Ed25519PrivateKey.from_private_bytes(priv_key_bytes)

          # 草稿模式下无法通过 releases/tags/{tag} 直接查询，需遍历 releases 列表按 tag_name 匹配
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases",
              headers={"Accept": "application/vnd.github+json", "Authorization": f"Bearer {token}", "User-Agent": "shipup-manifest"}
          )
          with urllib.request.urlopen(req) as resp:
              releases = json.loads(resp.read().decode("utf-8"))
          data = next((r for r in releases if r.get("tag_name") == tag), None)
          if not data:
              raise RuntimeError(f"未找到标签为 {tag} 的 Release 草稿")

          asset_map = {a["name"]: a for a in data.get("assets", [])}
          packages = {}

          for name, asset in asset_map.items():
              m = re.match(r"^rddns-(.+)\.(zip|tar\.gz)$", name)
              if not m:
                  continue
              target = m.group(1)
              sha_name = f"rddns-{target}.sha256"
              if sha_name not in asset_map:
                  sha_name = f"{name}.sha256"
                  if sha_name not in asset_map:
                      continue

              sha_req = urllib.request.Request(
                  asset_map[sha_name]["browser_download_url"],
                  headers={"Authorization": f"Bearer {token}", "User-Agent": "shipup-manifest"}
              )
              with urllib.request.urlopen(sha_req) as s_resp:
                  sha_text = s_resp.read().decode("utf-8").strip()
                  checksum = re.search(r"([a-fA-F0-9]{64})", sha_text).group(1).lower()

              # 将十六进制 sha256 还原为 32 字节二进制摘要进行标准 Ed25519 签名
              raw_digest = bytes.fromhex(checksum)
              sig_bytes = signer.sign(raw_digest)
              sig_b64 = base64.b64encode(sig_bytes).decode("utf-8")

              packages[target] = {
                  "url": asset["browser_download_url"],
                  "checksum": f"sha256:{checksum}",
                  "signature": sig_b64,
                  "package_type": "archive",
                  "executable_path": "rddns.exe" if "windows" in target else "rddns",
                  "size": asset.get("size", 0),
              }

          manifest = {
              "version": tag.lstrip("vV"),
              "notes": data.get("body", ""),
              "pub_date": data.get("created_at", ""),
              "packages": packages,
          }

          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
          EOF

          gh release upload "${{ github.ref_name }}" latest.json --clobber --repo "${{ github.repository }}"
          # 待 16 平台二进制与清单全部就位后，将草稿正式发布为公开 Release (P1-26)
          gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
