[package]
name = "rddns"
version = "0.10.0"
edition = "2024"
description = "A high-performance, lightweight, and full-featured Dynamic DNS (DDNS) and notification service written in Rust"
license = "MIT"
readme = "README.md"
authors = ["wangle"]
repository = "https://github.com/mangerle/rddns"
homepage = "https://github.com/mangerle/rddns"
keywords = ["ddns", "dns", "cloudflare", "alidns", "dnspod"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
tokio = { version = "1.43", default-features = false, features = ["rt", "macros", "time", "sync", "process", "net", "signal", "io-util"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
axum = { version = "0.8" }
log = "0.4"
fern = { version = "0.7", features = ["colored"] }
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
idna = "1.0"
url = "2.5"
getrandom = "0.3"
network-interface = "2.0"
parking_lot = "0.12"
rust-embed = "8.5"
tempfile = "3.16"
bcrypt = "0.17"
tokio-stream = { version = "0.1", features = ["sync"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
psl = "2.1"
shipup = { version = "0.5.1", default-features = false, features = ["async", "archive", "rustls-tls"] }
dashmap = "6.2.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"       # 针对二进制体积与代码段映射进行极致优化 (Optimize for minimum size)
lto = "thin"          # 采用 ThinLTO 平衡编译时间与跨模块死代码裁剪 (加速发布流水线构建)
codegen-units = 1     # 启用单代码生成单元，最大化优化内联
strip = true          # 自动剥离符号表与调试元信息
# 刻意不设置 panic = "abort"：保留栈展开(unwinding)能力，使后台任务的
# JoinError::is_panic() 得以生效，从而在单个任务崩溃时能够被上层捕获、
# 记录告警并触发降级自愈，而非直接终止整个进程。

[[bench]]
name = "core_benchmarks"
harness = false